c_compiler:
- gcc
c_compiler_version:
- '15'
c_stdlib:
- sysroot
c_stdlib_version:
- '2.39'
channel_sources:
- conda-forge
channel_targets:
- conda-forge main
cxx_compiler:
- gxx
cxx_compiler_version:
- '15'
docker_image:
- quay.io/condaforge/linux-anvil-x86_64:alma10
eigen_abi_profile:
- '100'
eigen_max_align_bytes:
- '16'
fortran_compiler:
- gfortran
fortran_compiler_version:
- '15'
target_platform:
- linux-riscv64
zip_keys:
- - c_compiler_version
  - cxx_compiler_version
  - fortran_compiler_version
- - eigen_abi_profile
  - eigen_max_align_bytes
